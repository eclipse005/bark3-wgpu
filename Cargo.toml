[package]
name = "bark3-wgpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Bark 3.0 (Parakeet TDT 0.6B, English) speech recognition in Rust with wgpu and a CPU backend"
license = "MIT"

[dependencies]
wgpu = "30.0.1"
pollster = "0.4"
rayon = "1.10"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
bytes = "1.11"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
rustfft = "6"
anyhow = "1"
constriction = "0.5"
lzma-rs = "0.3"
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }

[profile.release]
debug = false

[[bin]]
name = "bark3"
path = "src/main.rs"

[workspace]
members = ["wasm"]
