[package]
name = "bark3-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Browser bindings for bark3-wgpu: WebGPU speech recognition with a VAD-driven timer"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bark3-wgpu = { path = ".." }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
